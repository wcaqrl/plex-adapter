name: Update Plex for LazyCat
run-name: ${{ (github.event_name == 'push' || inputs.dry-run == true) && 'Plex → LazyCat [仅检查]' || 'Plex → LazyCat [验证升级、打包并送审]' }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update.yml
      - scripts/**
      - content/**
      - lazycat-action.yml
      - lzc-build.yml
      - lzc-manifest.yml
      - package.yml
  schedule:
    # 04:37 UTC = 每天北京时间 12:37；GitHub 调度可能延迟。
    - cron: '37 4 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 勾选＝仅检查版本和更新日志；取消勾选＝验证升级、转存、打包并送审。
        type: boolean
        default: true
      retry-rejected:
        description: 修复适配后重试被拒绝的上游版本，分配新的应用版本；须取消仅检查。
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
concurrency:
  group: plex-lazycat-update
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify adapter scripts
        run: |
          bash -n scripts/test-upgrade.sh
          sh -n content/bind.sh
          python3 -B -m unittest discover -s tests -v
      - name: Verify write access and developer permission
        if: github.event_name != 'push' && inputs.dry-run != true
        env:
          LZC_API_TOKEN: ${{ secrets.LZC_API_TOKEN }}
        run: |
          set -euo pipefail
          git push --dry-run origin "HEAD:${GITHUB_REF_NAME}"
          if [[ -z "${LZC_API_TOKEN}" ]]; then
            echo '::error::Add LZC_API_TOKEN in this adapter repository: Settings → Secrets and variables → Actions.'
            exit 1
          fi
          response_file="${RUNNER_TEMP}/plex-review-access.json"
          curl --fail --silent --show-error \
            --header "X-API-Token: ${LZC_API_TOKEN}" \
            --output "${response_file}" \
            'https://appstore.api.lazycat.cloud/sdk/v3/developer/app/cloud.lazycat.app.plex/review/list?page=0&size=1'
          python3 - "${response_file}" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as response:
              result = json.load(response)
          if result.get("errorCode") != 0:
              raise SystemExit("Developer PAT cannot access cloud.lazycat.app.plex reviews: " + str(result.get("msg", "unknown error")))
          print("Developer permission verified for cloud.lazycat.app.plex.")
          PY

  update:
    needs: validate
    uses: wcaqrl/lazycat-action/.github/workflows/lazycat.yml@v1
    with:
      config: lazycat-action.yml
      operation: auto
      runner: ubuntu-24.04
      dry-run: ${{ github.event_name == 'push' || inputs.dry-run || false }}
      retry-rejected: ${{ github.event_name == 'workflow_dispatch' && inputs.retry-rejected || false }}
    secrets:
      LZC_API_TOKEN: ${{ secrets.LZC_API_TOKEN }}
