package: cloud.lazycat.app.plex
# Store baseline; the Action allocates the next version only when packaging.
version: 1.43.6
name: Plex
description: Plex 媒体服务器，集中管理并播放自己的电影、电视剧、音乐和照片。
homepage: https://www.plex.tv
author: Plex
license: https://www.plex.tv/about/privacy-legal/plex-terms-of-service/
min_os_version: 1.5.0
locales:
  zh-CN:
    name: Plex
    description: Plex 媒体服务器，集中管理并播放自己的电影、电视剧、音乐和照片。
  en-US:
    name: Plex
    description: Plex Media Server organizes and streams your movies, TV shows, music, and photos.
permissions:
  required:
    - net.internet
    - net.lan
    - document.read
    - media.read
  optional:
    - device.dri.render
