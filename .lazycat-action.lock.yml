    changelog: |-
        Plex Media Server 1.43.4.10903-e5521bd8c

        ## Added
        (GPU) Added support for HEVC transcode on devices that only support 8 bit HEVC encoding (PM-5595)
        (Library) Add library filter for HDR10+ media (PM-5617)
        (Metadata) Add HDR10+ metadata detection (PM-5355)
        (Transcoding) Added support for HW Tonemapping on MacOS (PM-4883)
        (Transcoding) Added support for HW burn in of image based subtitle formats (such as PGS) on MacOS (PM-4882)
        (Transcoding) Added support for HW decoding AV1 videos on MacOS (M3 and newer) (PM-4884)

        ## Fixed
        (Crash) Certain malformed webp images can crash the server (PM-5565)
        (Crash) Handling some POST requests could crash the server (PM-5592)
        (Crash) In rare instances, a timeline request can crash the server (PM-5590)
        (Database) Fixed a corrupt search index that made the database fail its integrity check and blocked backups (PM-5868)
        (HTTP) The server could crash after making certain HTTP requests (PM-5964)
        (Metadata) In rare instances, triggering an item rematch could crash the server (PM-5591)
        (Metadata) Reject invalid custom provider prefixes before they get added (PM-5275)
        (Metadata) Year value stored in TYER id3 tags would not be read (PM-5532)
        (Search) Fixed albums, tracks and episodes whose parent item was missing being left out of search results (PM-5868)
        (Shield) Tonemapping was being applied incorrectly (PM-5748)
        (Tuner) The Plex Tuner Service can crash during startup and shutdown (PM-5627)
